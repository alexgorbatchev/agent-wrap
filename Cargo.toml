[package]
name = "agent-wrap"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Interactive coding agent wrapper with a live project and branch header"

[dependencies]
agent-common = { git = "https://github.com/alexgorbatchev/agent-status.git", rev = "8eb986817db0301568b811641d28d55f87cb349c" }
agent-parser = { git = "https://github.com/alexgorbatchev/agent-parser.git", rev = "f5510c8c2881fe35055d80ee99b1ce4124b02670" }
agent-watcher = { git = "https://github.com/alexgorbatchev/agent-watcher.git", rev = "fd796ca17e5bdb70d9749347b39d2bd2eadec57e" }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
tui-frame = { git = "https://github.com/alexgorbatchev/tui-frame-rust.git", rev = "3e3198f558f2d71e2f0e5b9c45bc559f26217378" }
portable-pty = { git = "https://github.com/alexgorbatchev/tui-frame-rust.git", rev = "3e3198f558f2d71e2f0e5b9c45bc559f26217378" }
clap = { version = "4.6.7", features = ["string"] }
clap_complete = "4.6.5"
dirs = "7.0.0"
log = "0.4.32"
log4rs = { path = "vendor/log4rs", default-features = false, features = ["rolling_file_appender","compound_policy","fixed_window_roller","size_trigger","pattern_encoder","gzip"] }
go-duration = "0.2.0"
libc = "0.2.186"
palette = "0.7.7"
path-clean = "1.0.1"
ratatui = { version = "0.30.2", default-features = false }
regex = "1.12.4"
serde_json = "1.0.150"
sha2 = "0.11.0"
signal-hook = "0.4.3"
strip-ansi-escapes = "0.2.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
filetime = "0.2.29"
rusqlite = { version = "0.39.0", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
